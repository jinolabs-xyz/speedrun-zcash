name: deploy

# Every commit landing on master goes straight to the Cloudflare worker.
# Requires two repository secrets (Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN   — "Edit Cloudflare Workers" template token
#   CLOUDFLARE_ACCOUNT_ID  — from the dashboard sidebar
on:
  push:
    branches: [master]

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/scaffold-zec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/scaffold-zec/package-lock.json
      - run: npm ci
      # vendor/ is gitignored: the 57 MB wasm ships to learners from R2,
      # not from the repo. The sync-webzjs prebuild hook still expects the
      # directory to exist, so give it an empty one.
      - run: mkdir -p vendor/webzjs-wallet
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # A deploy that ships a broken Worker should fail THIS run, not greet
      # the next learner. /api/me proves the Worker, Next routing, and D1;
      # the wasm HEAD proves the R2 + edge-cache path the wallet boots from.
      - name: Smoke-test production
        run: |
          sleep 10
          curl -fsS --max-time 30 https://speedrun-zcash.aayushgiri1234.workers.dev/api/me > /dev/null
          curl -fsSI --max-time 60 https://speedrun-zcash.aayushgiri1234.workers.dev/webzjs/webzjs_wallet_bg.wasm | grep -qi 'content-type: application/wasm'
