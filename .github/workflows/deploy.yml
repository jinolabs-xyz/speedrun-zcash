name: deploy

# Every commit landing on master goes straight to the Cloudflare worker.
# Requires two repository secrets (Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN   — "Edit Cloudflare Workers" template token
#   CLOUDFLARE_ACCOUNT_ID  — from the dashboard sidebar
on:
  push:
    branches: [master]

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/scaffold-zec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/scaffold-zec/package-lock.json
      - run: npm ci
      # vendor/ is gitignored: the 57 MB wasm ships to learners from R2,
      # not from the repo. The sync-webzjs prebuild hook still expects the
      # directory to exist, so give it an empty one.
      - run: mkdir -p vendor/webzjs-wallet
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
