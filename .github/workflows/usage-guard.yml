name: r2-usage-guard

# Daily check that month-to-date R2 usage stays inside the free tier.
# Goes red (and emails maintainers) at 80% of any limit, while there is
# still month left to react. See scripts/r2-usage-guard.mjs.
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/r2-usage-guard.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
